# UniSDK Documentation — Build & Deploy to GitHub Pages
#
# Supports multi-language (en/zh) and multi-version (main + develop + v* tags) builds.
#
# Triggered by:
#   - Push to main branch          -> builds "latest" (stable snapshot from develop)
#   - Push to develop branch       -> builds "dev" (active development)
#   - Push a tag matching v*       -> builds the tag version
#
# Version naming convention:
#   v0.2.0          -> SDK v0.2.0 release
#   Doc-only fixes  -> merge to main, no tag needed (latest auto-updates)
#
# Output structure on gh-pages:
#   /index.html       <- Landing page (language + version selector)
#   /versions.json    <- Version metadata for version switcher JS
#   /en/latest/       <- Latest stable English docs (built from develop, promoted via main)
#   /en/dev/          <- Active development English docs
#   /en/v0.2.0/       <- Frozen English docs for SDK v0.2.0
#
name: Docs Deploy

on:
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SDK_REPO: telink-semi/unisdk
  SDK_PATH: _sdk_src
  LANGUAGES: "en zh"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: ci-${{ github.ref }}

    steps:
      - name: Checkout unisdk-doc (full history for versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SDK checkout
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: _sdk_src
          key: sdk-${{ env.SDK_REPO }}-release-v0.2.0-${{ github.sha }}
          restore-keys: |
            sdk-${{ env.SDK_REPO }}-release-v0.2.0-

      - name: Checkout SDK repo (for API headers)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDK_REPO }}
          path: ${{ env.SDK_PATH }}
          ref: release-v0.2.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen texlive-xetex texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra latexmk texlive-lang-chinese fonts-noto-cjk-extra

      - name: Check toctree coverage (all .md/.rst files must be listed in index.rst)
        run: bash scripts/check_doc_coverage.sh

      - name: Generate API reference (Doxygen XML + RST files)
        run: |
          python scripts/gen_api_rst.py
          mkdir -p _api_rst_cache
          for subdir in source/api_reference/*/; do
            if [ -d "$subdir" ]; then
              cp -r "$subdir" _api_rst_cache/
            fi
          done

      - name: Compile .po translations to .mo
        run: sphinx-intl build -l zh

      - name: Build all versions
        run: |
          OUTPUT_DIR="_build/versions"
          mkdir -p "$OUTPUT_DIR"

          build_version() {
            local lang="$1"
            local version="$2"
            local version_label="$3"

            echo "=== Building $version ($lang) -> $version_label ==="
            git checkout "$version"

            if [ -d "_api_rst_cache" ]; then
              for subdir in _api_rst_cache/*/; do
                if [ -d "$subdir" ]; then
                  mkdir -p "source/api_reference/$(basename "$subdir")"
                  cp -r "$subdir"/* "source/api_reference/$(basename "$subdir")/"
                fi
              done
            fi

            local final_dir="$OUTPUT_DIR/$lang/$version_label"

            UNISDK_DOC_LANG="$lang" \
            UNISDK_DOC_VERSION="$version_label" \
            UNISDK_DOC_RELEASE="$version_label" \
            sphinx-build -b html -D master_doc=index -c . source "$final_dir"
          }

          # ---- Determine source ref and version label ----
          case "${{ github.ref_type }}" in
            branch)
              case "${{ github.ref_name }}" in
                main)
                  SOURCE_REF="develop"
                  VERSION_LABEL="latest"
                  ;;
                develop)
                  SOURCE_REF="develop"
                  VERSION_LABEL="dev"
                  ;;
              esac
              ;;
            tag)
              TAG="${{ github.ref_name }}"
              SOURCE_REF="$TAG"
              VERSION_LABEL="${TAG#v}"
              ;;
          esac

          echo "SOURCE_REF=$SOURCE_REF VERSION_LABEL=$VERSION_LABEL"

          # ---- Build the source branch/ref ----
          for lang in $LANGUAGES; do
            build_version "$lang" "$SOURCE_REF" "$VERSION_LABEL"
          done

          # ---- Build all v* tags ----
          for tag in $(git tag -l 'v*' --sort=-v:refname); do
            label="${tag#v}"
            [ "$label" = "$VERSION_LABEL" ] && continue
            for lang in $LANGUAGES; do
              build_version "$lang" "$tag" "$tag"
            done
          done

          python scripts/generate_landing.py "$OUTPUT_DIR" "$OUTPUT_DIR"
          cp -r _static "$OUTPUT_DIR/_static"

          echo "=== All versions built ==="
          find "$OUTPUT_DIR" -maxdepth 3 -type d | head -30

      - name: Build PDF documentation
        run: |
          # Build English PDF
          UNISDK_DOC_LANG=en sphinx-build -b latex -c . -D latex_engine=xelatex source/ _build/latex/en
          make -C _build/latex/en all-pdf 2>/dev/null || latexmk -xelatex -cd _build/latex/en/*.tex

          # Build Chinese PDF
          UNISDK_DOC_LANG=zh sphinx-build -b latex -c . -D latex_engine=xelatex source/ _build/latex/zh
          make -C _build/latex/zh all-pdf 2>/dev/null || latexmk -xelatex -cd _build/latex/zh/*.tex

          # Copy PDFs to output
          mkdir -p _build/versions/en/_downloads _build/versions/zh/_downloads
          cp _build/latex/en/*.pdf _build/versions/en/_downloads/unisdk-doc.pdf 2>/dev/null || true
          cp _build/latex/zh/*.pdf _build/versions/zh/_downloads/unisdk-doc.pdf 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/versions
          force_orphan: true
