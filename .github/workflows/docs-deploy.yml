# UniSDK Documentation — Build & Deploy to GitHub Pages
#
# Supports multi-language (en/zh) and multi-version (main + develop + v* tags) builds.
#
# Triggered by:
#   - Push to main branch          → builds "latest" (stable snapshot from develop)
#   - Push to develop branch       → builds "dev" (active development)
#   - Push a tag matching v*       → builds the tag version
#
# Version naming convention:
#   v0.2.0          → SDK v0.2.0 release
#   v0.2.0-doc.1    → Doc-only fix after SDK v0.2.0
#
# Output structure on gh-pages:
#   /index.html       ← Landing page (language + version selector)
#   /versions.json    ← Version metadata for version switcher JS
#   /en/latest/       ← Latest stable English docs (built from develop, promoted via main)
#   /en/dev/          ← Active development English docs
#   /en/v0.2.0/       ← Frozen English docs for SDK v0.2.0
#
name: Docs Deploy

on:
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SDK_REPO: telink-semi/unisdk
  SDK_PATH: _sdk_src
  LANGUAGES: "en"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: ci-${{ github.ref }}

    steps:
      - name: Checkout unisdk-doc (full history for versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version label from git ref
        id: version-label
        run: |
          case "${{ github.ref }}" in
            refs/heads/main)
              echo "label=latest" >> "$GITHUB_OUTPUT"
              echo "source_ref=develop"
              ;;
            refs/heads/develop)
              echo "label=dev" >> "$GITHUB_OUTPUT"
              echo "source_ref=develop"
              ;;
            refs/tags/v*)
              TAG="${GITHUB_REF#refs/tags/}"
              LABEL="${TAG#v}"
              echo "label=$LABEL" >> "$GITHUB_OUTPUT"
              echo "source_ref=$TAG"
              ;;
          esac

      - name: Cache SDK checkout
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: _sdk_src
          key: sdk-${{ env.SDK_REPO }}-release-v0.2.0-${{ github.sha }}
          restore-keys: |
            sdk-${{ env.SDK_REPO }}-release-v0.2.0-

      - name: Checkout SDK repo (for API headers)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDK_REPO }}
          path: ${{ env.SDK_PATH }}
          ref: release-v0.2.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen

      - name: Generate API reference (Doxygen XML + RST files)
        run: |
          # Run gen_api_rst.py to generate per-group Doxygen XML and per-header RST files.
          # This replaces the old single doxygen Doxyfile.in approach because conf.py's breathe_projects
          # expects per-group XML (_doxygen/public_api/xml, _doxygen/core_drivers/xml, etc.).
          python scripts/gen_api_rst.py

          # Cache generated RST subdirectories for multi-version builds.
          # These subdirectories (public_api/, core_drivers/, soc_drivers/) are not tracked in git,
          # but git checkout of different versions won't remove them since they're not tracked.
          # The cache is a safety net just in case.
          mkdir -p _api_rst_cache
          for subdir in en/api_reference/*/; do
            if [ -d "$subdir" ]; then
              cp -r "$subdir" _api_rst_cache/
            fi
          done

      - name: Build all versions
        run: |
          OUTPUT_DIR="_build/versions"
          mkdir -p "$OUTPUT_DIR"

          # ---- Helper: build a single version for a single language ----
          build_version() {
            local lang="$1"
            local version="$2"
            local version_label="$3"

            echo "=== Building $version ($lang) → $version_label ==="
            git checkout "$version"

            # Per-group Doxygen XML was already generated by gen_api_rst.py before the loop
            # and copied to _doxygen/. _doxygen/ is not tracked in git, so it persists.
            # Ensure the per-header RST subdirectories are in place
            # (not tracked in git, but just in case):
            if [ -d "_api_rst_cache" ]; then
              for subdir in _api_rst_cache/*/; do
                if [ -d "$subdir" ]; then
                  mkdir -p "en/api_reference/$(basename "$subdir")"
                  cp -r "$subdir"/* "en/api_reference/$(basename "$subdir")/"
                fi
              done
            fi

            local final_dir="$OUTPUT_DIR/$lang/$version_label"

            UNISDK_DOC_LANG="$lang" \
            UNISDK_DOC_VERSION="$version_label" \
            UNISDK_DOC_RELEASE="$version_label" \
            sphinx-build -b html -D master_doc=index -c . "$lang" "$final_dir"
          }

          # ---- 1. Build the source branch/ref ----
          VERSION_LABEL="${{ steps.version-label.outputs.label }}"
          SOURCE_REF="${{ steps.version-label.outputs.source_ref }}"
          for lang in $LANGUAGES; do
            build_version "$lang" "$SOURCE_REF" "$VERSION_LABEL"
          done

          # ---- 2. Build all v* tags (including the current one if it's a tag) ----
          for tag in $(git tag -l 'v*' --sort=-v:refname); do
            # Strip leading 'v' for display label
            label="${tag#v}"
            # If the triggered ref is also a tag with same label, skip it (already built)
            [ "$label" = "$VERSION_LABEL" ] && continue
            for lang in $LANGUAGES; do
              build_version "$lang" "$tag" "$tag"
            done
          done

          # ---- 3. Generate version metadata and landing page ----
          python scripts/generate_landing.py "$OUTPUT_DIR" "$OUTPUT_DIR"

          # Copy static assets (logo) to output root for landing page
          cp -r _static "$OUTPUT_DIR/_static"

          echo "=== All versions built ==="
          find "$OUTPUT_DIR" -maxdepth 3 -type d | head -30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/versions
          force_orphan: true
