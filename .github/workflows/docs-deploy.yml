# UniSDK Documentation — Build & Deploy to GitHub Pages
#
# Supports multi-language (en/zh) and multi-version (main + v* tags) builds.
#
# Triggered by:
#   - Push to main branch          → builds "main" (latest) for both languages
#   - Push a tag matching v*       → builds the tag version + "main" (latest) for both languages
#
# Version naming convention:
#   v0.2.0          → SDK v0.2.0 release
#   v0.2.0-doc.1    → Doc-only fix after SDK v0.2.0
#
# Output structure on gh-pages:
#   /index.html       ← Landing page (language + version selector)
#   /versions.json    ← Version metadata for version switcher JS
#   /en/main/         ← Latest English docs
#   /en/v0.2.0/       ← Frozen English docs for SDK v0.2.0
#   /zh/main/         ← Latest Chinese docs
#   /zh/v0.2.0/       ← Frozen Chinese docs for SDK v0.2.0
#
name: Docs Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SDK_REPO: telink-semi/unisdk
  SDK_PATH: _sdk_src
  LANGUAGES: "en"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: ci-${{ github.ref }}

    steps:
      - name: Checkout unisdk-doc (full history for versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SDK checkout
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: _sdk_src
          key: sdk-${{ env.SDK_REPO }}-main-${{ github.sha }}
          restore-keys: |
            sdk-${{ env.SDK_REPO }}-main-

      - name: Checkout main SDK repo (for API headers)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDK_REPO }}
          path: ${{ env.SDK_PATH }}
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen

      - name: Generate Doxygen XML (API reference)
        run: |
          mkdir -p _doxygen
          doxygen Doxyfile.in

      - name: Build all versions
        run: |
          OUTPUT_DIR="_build/versions"
          mkdir -p "$OUTPUT_DIR"

          # ---- Helper: build a single version for a single language ----
          build_version() {
            local lang="$1"
            local version="$2"
            local version_label="$3"

            echo "=== Building $version ($lang) ==="
            git checkout "$version"

            # Re-generate Doxygen for this version (API may differ)
            mkdir -p _doxygen
            doxygen Doxyfile.in 2>/dev/null || true

            local final_dir="$OUTPUT_DIR/$lang/$version_label"

            UNISDK_DOC_LANG="$lang" \
            UNISDK_DOC_VERSION="$version_label" \
            UNISDK_DOC_RELEASE="$version_label" \
            sphinx-build -b html -D master_doc=index -c . "$lang" "$final_dir"

            # Restore main branch state
            git checkout main
          }

          # ---- 1. Build main branch for all languages ----
          for lang in $LANGUAGES; do
            build_version "$lang" "main" "main"
          done

          # ---- 2. Build all v* tags for all languages ----
          for tag in $(git tag -l 'v*' --sort=-v:refname); do
            # Strip leading 'v' for display label
            label="${tag#v}"
            for lang in $LANGUAGES; do
              build_version "$lang" "$tag" "$tag"
            done
          done

          # ---- 3. Generate version metadata and landing page ----
          python scripts/generate_landing.py "$OUTPUT_DIR" "$OUTPUT_DIR"

          # Copy static assets (logo) to output root for landing page
          cp -r _static "$OUTPUT_DIR/_static"

          echo "=== All versions built ==="
          find "$OUTPUT_DIR" -maxdepth 3 -type d | head -30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/versions
          force_orphan: true