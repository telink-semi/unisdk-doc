# UniSDK Documentation — Build & Deploy to GitHub Pages
#
# Triggered by:
#   - Push to main branch          → builds "main" (latest)
#   - Push a tag matching v*       → builds the tag version + "main" (latest)
#
# Version naming convention:
#   v0.2.0          → SDK v0.2.0 release
#   v0.2.0-doc.1    → Doc-only fix after SDK v0.2.0
#
# Output structure on gh-pages:
#   /main/          ← latest docs (from main branch)
#   /v0.2.0/        ← frozen docs for SDK v0.2.0
#   /v0.2.0-doc.1/  ← doc-only fix for SDK v0.2.0
#   /index.html     ← redirects to /main/
#
name: Docs Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency: ci-${{ github.ref }}

    steps:
      - name: Checkout unisdk-doc (full history for versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout main SDK repo (for API headers)
        uses: actions/checkout@v4
        with:
          repository: telink-semi/unisdk
          path: _sdk_src
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen

      - name: Generate Doxygen XML (API reference)
        run: |
          mkdir -p _doxygen
          doxygen Doxyfile.in

      - name: Build all versions
        run: |
          OUTPUT_DIR="_build/versions"
          mkdir -p "$OUTPUT_DIR"

          # ---- 1. Build main branch (latest) ----
          echo "=== Building main (latest) ==="
          git checkout main
          sphinx-build -b html . "$OUTPUT_DIR/main"

          # ---- 2. Build all v* tags ----
          for tag in $(git tag -l 'v*' --sort=-v:refname); do
            echo "=== Building $tag ==="
            git checkout "$tag"
            # Re-generate Doxygen for this version (API may differ)
            mkdir -p _doxygen
            doxygen Doxyfile.in 2>/dev/null || true
            sphinx-build -b html . "$OUTPUT_DIR/$tag"
          done

          # ---- 3. Restore main branch ----
          git checkout main

          # ---- 4. Create root redirect ----
          cat > "$OUTPUT_DIR/index.html" << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=./main/" />
            <title>UniSDK Documentation</title>
          </head>
          <body>
            <p>Redirecting to <a href="./main/">latest documentation</a>...</p>
          </body>
          </html>
          EOF

          echo "=== All versions built ==="
          ls -la "$OUTPUT_DIR/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/versions
          force_orphan: true
